<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2640"/>
      <stop offset="100%" stop-color="#0f1526"/>
    </linearGradient>
    <linearGradient id="folio" x1="16" y1="48" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5b4bff"/>
      <stop offset="60%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="arrow" x1="14" y1="44" x2="50" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <!-- Bottom folio layer -->
  <path d="M32 22L48 36L32 50L16 36Z" fill="url(#folio)" fill-opacity="0.28" stroke="url(#folio)" stroke-opacity="0.5" stroke-width="1.2" stroke-linejoin="round"/>
