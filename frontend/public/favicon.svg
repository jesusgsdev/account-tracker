  <path d="M32 12L48 26L32 40L16 26Z" fill="url(#folio)" fill-opacity="0.55" stroke="url(#folio)" stroke-opacity="0.9" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Ascending trajectory arrow -->
  <path d="M15 39L26.5 27.5L32.5 33.5L47 19" stroke="url(#arrow)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 17H49V28" stroke="#34d399" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
