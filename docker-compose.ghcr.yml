# Pull prebuilt images from GHCR instead of building on the NAS.
# Defaults to the :latest release tag (or override with APP_VERSION=v1.0.0 in .env / shell):
#   docker compose -f docker-compose.ghcr.yml up -d
# Private packages need a one-time:
#   sudo docker login ghcr.io -u jesusgsdev      (Classic PAT with read:packages)
# If this doesn't work on your NAS, use docker-compose.yml (builds locally) instead.
services:
  backend:
    image: ghcr.io/jesusgsdev/foliotrack-backend:${APP_VERSION:-latest}
    pull_policy: always
    # Run as root, as the original version did. Synology ACLs on ./data reject
    # non-root container users; to harden, set a user that owns ./data (e.g. "1026:100").
    user: "0:0"
    env_file:
      - .env
    environment:
      DB_PATH: /data/tracker.db
    volumes:
      # Directory mount (never single files): holds tracker.db, -wal and -shm
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  frontend:
    image: ghcr.io/jesusgsdev/foliotrack-frontend:${APP_VERSION:-latest}
    pull_policy: always
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
