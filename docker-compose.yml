services:
  backend:
    image: foliotrack-backend:${APP_VERSION:-dev}
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    # Run as root, as the original version did. Synology ACLs on ./data reject
    # non-root container users; to harden, set a user that owns ./data (e.g. "1026:100").
    user: "0:0"
    env_file:
      - .env
    environment:
      DB_PATH: /data/tracker.db
    volumes:
      # Directory mount (never single files): holds tracker.db, -wal and -shm
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  frontend:
    image: foliotrack-frontend:${APP_VERSION:-dev}
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        APP_VERSION: ${APP_VERSION:-}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
