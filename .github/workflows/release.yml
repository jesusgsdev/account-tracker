name: Release

# Publishes versioned images to GHCR when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# Images: ghcr.io/<owner>/foliotrack-backend:v1.2.0 and ghcr.io/<owner>/foliotrack-frontend:v1.2.0
# There is deliberately no "latest" tag, so the NAS can never reuse a stale image.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: foliotrack-backend
            context: backend
            dockerfile: backend/Dockerfile.backend
          - name: foliotrack-frontend
            context: frontend
            dockerfile: frontend/Dockerfile.frontend
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          flavor: latest=false
          tags: type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
